name: edubridge
description: "EduBridge — сургуулийн холбоо барих апп."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite_common_ffi: ^2.4.2
  crypto: ^3.0.7
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/edubridge_launcher_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/edubridge_launcher_icon.png
  macos:
    generate: true
    image_path: assets/branding/edubridge_launcher_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo/edubridge_logo.png
